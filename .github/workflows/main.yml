name: Merge BPF files from R24U into R15-OneUI

on:
  workflow_dispatch:        # allows manual trigger
  push:
    branches: [ R15-OneUI ] # optional: auto-run on push to R15-OneUI

env:
  MERGE_FROM_BRANCH: R24U
  TARGET_BRANCH: R15-OneUI
  NEW_BRANCH_PREFIX: R15-OneUI-bpf-merged

jobs:
  merge-bpf:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout target branch (${{ env.TARGET_BRANCH }})
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: kernel
          fetch-depth: 0

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch source branch (${{ env.MERGE_FROM_BRANCH }})
        working-directory: ./kernel
        run: |
          git fetch origin ${{ env.MERGE_FROM_BRANCH }}

      - name: Extract and apply BPF files from ${{ env.MERGE_FROM_BRANCH }}
        working-directory: ./kernel
        run: |
          # List all files in source branch, filter those containing "bpf" (case-insensitive)
          bpf_files=$(git ls-tree -r origin/${{ env.MERGE_FROM_BRANCH }} --name-only | grep -i bpf || true)

          if [ -z "$bpf_files" ]; then
            echo "No BPF files found in ${{ env.MERGE_FROM_BRANCH }}. Exiting."
            exit 0
          fi

          echo "Found BPF files:"
          echo "$bpf_files"

          # Checkout each BPF file from source branch into working directory
          echo "$bpf_files" | while read -r file; do
            git checkout origin/${{ env.MERGE_FROM_BRANCH }} -- "$file" 2>/dev/null || echo "Warning: could not checkout $file"
          done

          # Stage all changes (additions and modifications)
          git add -A

          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Merge BPF files from ${{ env.MERGE_FROM_BRANCH }}"
            echo "BPF files merged successfully."
          else
            echo "No BPF file changes to commit."
          fi

      - name: Create unique branch with merged BPF files
        working-directory: ./kernel
        run: |
          timestamp=$(date +%Y%m%d-%H%M%S)
          random=$(openssl rand -hex 4)   # 8 random hex characters
          new_branch="${{ env.NEW_BRANCH_PREFIX }}-${timestamp}-${random}"
          git checkout -b "$new_branch"
          git push origin "$new_branch"
          echo "NEW_BRANCH=$new_branch" >> $GITHUB_ENV

      - name: Output new branch name
        run: |
          echo "✅ New branch created: ${{ env.NEW_BRANCH }}"
          echo "You can now check it out locally or use it for a build."
